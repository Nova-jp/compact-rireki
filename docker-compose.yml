services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PDF_SERVER_URL=http://pdf-server:3001/generate
    depends_on:
      - pdf-server

  pdf-server:
    build:
      context: .
      dockerfile: Dockerfile.pdfserver
    ports:
      - "3001:3001"
    environment:
      - PDF_SERVER_PORT=3001
      - PDF_SERVER_API_KEY=${PDF_SERVER_API_KEY}
