name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: kantan-rireki
  REGION: asia-northeast1
  REGISTRY: asia-northeast1-docker.pkg.dev
  REPO: kantan-rireki-repo
  PDF_SERVICE: kantan-rireki-pdf
  WEB_SERVICE: kantan-rireki-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push PDF server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.pdfserver
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.PDF_SERVICE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.WEB_SERVICE }}:${{ github.sha }}
          build-args: NEXT_PUBLIC_GA_ID=G-5VY06FEBL8
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy PDF server
        id: deploy-pdf
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.PDF_SERVICE }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.PDF_SERVICE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --memory=2Gi --cpu=2 --min-instances=0 --port=3001 --allow-unauthenticated

      - name: Deploy Web server
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.WEB_SERVICE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: --min-instances=1 --allow-unauthenticated
          env_vars: PDF_SERVER_URL=${{ steps.deploy-pdf.outputs.url }}/generate
